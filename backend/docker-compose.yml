services:
  postgres:
    image: postgres:16-alpine
    container_name: lockmylook-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: lockmylook
      POSTGRES_USER: lockmylook
      POSTGRES_PASSWORD: lockmylook_dev
    ports:
      - "5432:5432"
    volumes:
      - lockmylook_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lockmylook -d lockmylook"]
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 5s

volumes:
  lockmylook_postgres_data:
