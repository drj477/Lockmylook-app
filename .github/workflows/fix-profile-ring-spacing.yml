name: Refine profile ring spacing

on:
  push:
    branches: [master]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Update profile ring spacing
        shell: python
        run: |
          from pathlib import Path
          import re

          path = Path('mobile/lib/features/home/presentation/screens/home_screen.dart')
          text = path.read_text(encoding='utf-8')

          old = 'padding: EdgeInsets.all(selected ? 2.5 : 0),'
          new = 'padding: EdgeInsets.all(isAdd ? 0 : 4),'
          if old not in text:
              raise SystemExit('Profile bubble padding line not found')
          text = text.replace(old, new, 1)

          old = """border: Border.all(
                color: isAdd ? LockMyLookUi.border : LockMyLookUi.coral,
                width: isAdd ? 1.5 : (selected ? 3.5 : 1.5),
              ),"""
          new = """border: Border.all(
                color: isAdd ? LockMyLookUi.border : LockMyLookUi.coral,
                width: isAdd ? 1.5 : (selected ? 3.5 : 1.5),
              ),"""
          if old not in text:
              raise SystemExit('Profile bubble outer ring block not found')
          text = text.replace(old, new, 1)

          path.write_text(text, encoding='utf-8')

      - name: Commit and remove workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mobile/lib/features/home/presentation/screens/home_screen.dart
          git commit -m "fix: add consistent spacing around profile rings"
          git rm .github/workflows/fix-profile-ring-spacing.yml
          git commit -m "chore: remove temporary profile ring workflow"
          git push
