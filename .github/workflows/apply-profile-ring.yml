name: Apply profile ring design

on:
  push:
    branches: [master]

permissions:
  contents: write

jobs:
  apply:
    if: github.event.head_commit.message != 'fix: simplify profile rings'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Replace profile bubble only
        shell: python
        run: |
          from pathlib import Path
          import re

          path = Path('mobile/lib/features/home/presentation/screens/home_screen.dart')
          text = path.read_text(encoding='utf-8')

          pattern = re.compile(r"  Widget _profileBubble\(.*?\n  Widget _quickCard", re.S)
          match = pattern.search(text)
          if not match:
              raise SystemExit('Could not locate _profileBubble block')

          replacement = '''  Widget _profileBubble({
    required String label,
    required String initial,
    String? avatarUrl,
    IconData? icon,
    required bool selected,
    required VoidCallback onTap,
  }) {
    final isAdd = icon != null;
    final photoSize = selected ? 52.0 : 48.0;

    return GestureDetector(
      onTap: onTap,
      child: SizedBox(
        width: 64,
        child: Column(
          mainAxisSize: MainAxisSize.min,
          children: [
            SizedBox(
              width: 56,
              height: 56,
              child: DecoratedBox(
                decoration: BoxDecoration(
                  shape: BoxShape.circle,
                  border: Border.all(
                    color: isAdd ? LockMyLookUi.border : LockMyLookUi.coral,
                    width: 1.5,
                  ),
                ),
                child: Center(
                  child: isAdd
                      ? Icon(icon, size: 22, color: LockMyLookUi.ink)
                      : Container(
                          width: photoSize,
                          height: photoSize,
                          decoration: const BoxDecoration(shape: BoxShape.circle),
                          clipBehavior: Clip.antiAlias,
                          child: avatarUrl != null && avatarUrl.isNotEmpty
                              ? Image.network(
                                  avatarUrl,
                                  fit: BoxFit.cover,
                                  errorBuilder: (_, _, _) => _avatarFallback(initial),
                                )
                              : _avatarFallback(initial),
                        ),
                ),
              ),
            ),
            const SizedBox(height: 4),
            Text(
              label,
              maxLines: 1,
              overflow: TextOverflow.ellipsis,
              textAlign: TextAlign.center,
              style: const TextStyle(fontSize: 11, color: LockMyLookUi.ink),
            ),
          ],
        ),
      ),
    );
  }

  Widget _avatarFallback(String initial) {
    return Container(
      color: LockMyLookUi.background,
      alignment: Alignment.center,
      child: Text(
        initial,
        style: const TextStyle(fontWeight: FontWeight.w700, color: LockMyLookUi.coral),
      ),
    );
  }

  Widget _quickCard'''

          text = text[:match.start()] + replacement + text[match.end():]
          path.write_text(text, encoding='utf-8')

      - name: Verify ring implementation
        run: |
          grep -n "final photoSize\|width: 56\|LockMyLookUi.coral" mobile/lib/features/home/presentation/screens/home_screen.dart

      - name: Commit change and remove workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mobile/lib/features/home/presentation/screens/home_screen.dart
          git commit -m "fix: simplify profile rings"
          git rm .github/workflows/apply-profile-ring.yml
          git commit -m "chore: remove temporary profile ring workflow"
          git push
