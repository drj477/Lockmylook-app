name: Fix VTO compile references

on:
  push:
    branches: [master]

permissions:
  contents: write

jobs:
  fix:
    if: contains(github.event.head_commit.message, 'fix VTO wardrobe image references')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fix VTO source
        shell: python
        run: |
          from pathlib import Path
          import re

          p = Path('mobile/lib/features/outfits/presentation/screens/outfit_builder_screen.dart')
          text = p.read_text(encoding='utf-8')
          text = text.replace('image.url', 'image.imageUrl')
          text = re.sub(r'\n  String _categoryDisplayLabel\(String value\) \{.*?\n  \}\n', '\n', text, flags=re.S)
          p.write_text(text, encoding='utf-8')

      - name: Validate Dart source
        uses: subosito/flutter-action@v2
        with:
          flutter-version: stable
          channel: stable
      - run: flutter analyze mobile

      - name: Commit fixes and remove temporary workflow
        run: |
          rm -f .github/workflows/fix-vto-compile.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add mobile/lib/features/outfits/presentation/screens/outfit_builder_screen.dart .github/workflows/fix-vto-compile.yml
          git commit -m 'fix: restore VTO compile compatibility'
          git push