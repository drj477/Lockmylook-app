name: mobile
description: "LockMyLook Mobile Application"

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ">=3.12.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # --------------------------------------------------
  # State Management
  # --------------------------------------------------
  flutter_riverpod: ^3.3.2
  riverpod_annotation: 4.0.3

  # --------------------------------------------------
  # Navigation
  # --------------------------------------------------
  go_router: ^17.4.0

  # --------------------------------------------------
  # Networking
  # --------------------------------------------------
  dio: ^5.9.0
  pretty_dio_logger: ^1.4.0

  # --------------------------------------------------
  # Secure Storage
  # --------------------------------------------------
  flutter_secure_storage: ^11.0.0

  # --------------------------------------------------
  # Environment
  # --------------------------------------------------
  flutter_dotenv: ^6.0.1

  # --------------------------------------------------
  # Typography
  # --------------------------------------------------
  google_fonts: ^8.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

  # --------------------------------------------------
  # Code Generation (Riverpod only)
  # --------------------------------------------------
  build_runner: 2.15.1
  riverpod_generator: 4.0.4


  image_picker: ^1.1.2

flutter:
  uses-material-design: true

  assets:
    - .env
    - assets/images/
    - assets/icons/
    - assets/illustrations/
    - assets/animations/

  # fonts:
  #   - family: Inter
  #     fonts:
