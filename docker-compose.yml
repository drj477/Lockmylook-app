version: "3.9"

# Infrastructure only. The FastAPI app runs natively (uvicorn --reload).
services:
  postgres:
    image: postgres:16-alpine
    container_name: lockmylook_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: lockmylook
      POSTGRES_PASSWORD: lockmylook_dev
      POSTGRES_DB: lockmylook
    ports:
      - "5432:5432"
    volumes:
      - lockmylook_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lockmylook"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  lockmylook_pgdata:
